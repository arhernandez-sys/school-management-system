# Alembic configuration — School Management System (SIS) backend.
#
# NOTE: `sqlalchemy.url` is deliberately left EMPTY here. The real connection
# string is a secret (Supabase Postgres) read from the DATABASE_URL env var via
# app.config.Settings inside alembic/env.py — it is NEVER written to this tracked
# file. See alembic/env.py (`config.set_main_option`).

[alembic]
script_location = alembic
prepend_sys_path = .
# Use OS path separators in version-file paths (Windows-safe).
version_path_separator = os

# Secret intentionally absent — overridden in env.py from DATABASE_URL.
sqlalchemy.url =

[post_write_hooks]
# none

# Logging — quiet by default; raise to INFO for migration debugging.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
